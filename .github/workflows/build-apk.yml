name: Build COMET APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk COMET.apk
          ls -la COMET.apk

      - uses: actions/upload-artifact@v4
        with:
          name: COMET-apk
          path: COMET.apk

      # Tag a version (git tag v1.0 && git push --tags) and the APK appears under Releases > Assets
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: COMET.apk
