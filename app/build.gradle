apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    namespace "com.digitalminds.comet"
    compileSdk 34

    defaultConfig {
        applicationId "com.digitalminds.comet"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 5
        versionName "2.2"
        resConfigs "en"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        // Fixed key so every new COMET build installs over the previous one.
        release {
            storeFile file("comet.keystore")
            storePassword "comet-digitalminds"
            keyAlias "comet"
            keyPassword "comet-digitalminds"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.media3.common.util.UnstableApi"]
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/versions/**"]
        }
    }
}

dependencies {
    def media3 = "1.4.1"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
